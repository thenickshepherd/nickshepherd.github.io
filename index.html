<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Nick Shepherd</title>
  <meta name="author" content="">
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="style.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>

<body id="website" class="background-transition">

	<div class="main">
		<div class="main__inner">
			<div class="main__logo-text">
				<h1 class="main__logo-title"><span class="main__logo-faint">nick</span>shepherd<span class="dot">.</span></h1>
				<p class="main__logo-subtitle">Expert Web Solutions</p>
			</div>
			<div class="main__contact">
				<p><a class="btn" href="mailto:hello@nickshepherd.co.uk">Get in touch</a></p>
			</div>
		</div>
	</div>

  <script src="js/script.js"></script>
</body>

<script>
	const div = document.getElementById("website");
	const classes = ["black", "green", "blue", "red", "purple"];
	let index = 0;

	// Make sure the permanent class is present, then set the initial colour class
	div.classList.add("background-transition");
	div.classList.add(classes[index]);

	setInterval(() => {
		div.classList.remove(classes[index]);
		index = (index + 1) % classes.length;
		div.classList.add(classes[index]);
	}, 5000);
</script>

</html>
