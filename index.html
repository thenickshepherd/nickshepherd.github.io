<script>
	const div = document.getElementById("website");
	const classes = ["navy", "orange", "green", "blue", "red"];
	let index = 0;

	// Make sure the permanent class is present, then set the initial colour class
	div.classList.add("background-transition");
	div.classList.add(classes[index]);

	setInterval(() => {
		div.classList.remove(classes[index]);
		index = (index + 1) % classes.length;
		div.classList.add(classes[index]);
	}, 5000);
</script>
